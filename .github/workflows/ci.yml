name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests (offline, no third-party packages)
        run: python -m unittest discover -s tests -v
      - name: Build package
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install build
          python -m build

  ui:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Playwright and Chromium (test-only, not a runtime dependency)
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run browser tests
        run: python -m unittest discover -s tests -p "test_ui_browser.py" -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install black ruff
      - run: black --check .
      - run: ruff check .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes prettier@3.8.1 --check "locdepintel/static/*.{js,html,css}"
